worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # Do not log query strings, cookies or request bodies.
  log_format safe '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log safe;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  upstream polaris {
    zone polaris 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server app-primary:3000 resolve max_fails=1 fail_timeout=10s;
    server app-backup:3000 resolve backup;
    keepalive 16;
  }
  server {
    listen 8080;
    client_max_body_size 1m;
    location = /api/v1/session {
      limit_req zone=login burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://polaris;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_next_upstream off;
    }
    location / {
      proxy_pass http://polaris;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
      # NGINX never replays a sent non-idempotent request. Do not add non_idempotent.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
